name = "tg-stream-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# One KV namespace holds everything (login session, webhook state, file keys).
# It is created automatically (Deploy button / wrangler deploy / npm run setup).
[[kv_namespaces]]
binding = "SESSIONS"

[observability]
enabled = true

# The download streaming runs inside this Durable Object (SQLite-backed, available on the Free plan).
[[durable_objects.bindings]]
name = "STREAMER"
class_name = "StreamerDO"

# One global instance: connection limits, /admin statistics and bot cooldowns.
[[durable_objects.bindings]]
name = "GUARD"
class_name = "GuardDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamerDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GuardDO"]
